[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-digest-agent"
version = "0.1.0"
description = "Local arXiv briefing and grounded QA agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "langgraph>=1,<2",
  "ollama>=0.6,<1",
  "sentence-transformers>=5,<6",
  "transformers>=4.45,<5",
  "chromadb>=1,<2",
  "PyMuPDF>=1.26,<2",
  "arxiv>=2.2,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pip-tools>=7,<8", "setuptools>=77"]

[project.scripts]
arxiv-agent = "arxiv_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
